<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Đỗ Hải Ly — Marketing Portfolio 2026</title>
<meta name="description" content="Portfolio Marketing Manager Đỗ Hải Ly — Retail & Education Marketing, AI-enabled Marketing Operations" />
<style>
  :root{
    --navy:#16384d;
    --cream:#f8f3ea;
    --tan:#c58b59;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#0d2333;
    font-family:'Segoe UI', Arial, sans-serif;
    color:#1f2933;
  }
  header.hero{
    padding:28px 16px 18px;
    text-align:center;
    background:linear-gradient(180deg,#0d2333,#16384d);
    color:#fff;
  }
  header.hero h1{
    margin:0 0 6px;
    font-size:clamp(22px,4vw,34px);
    letter-spacing:.5px;
  }
  header.hero p{
    margin:0;
    color:#dce7ee;
    font-size:clamp(13px,2.4vw,16px);
  }
  .contact-bar{
    margin-top:14px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
    font-size:13px;
  }
  .contact-bar span{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.25);
    padding:5px 12px;
    border-radius:999px;
  }
  main{
    max-width:1100px;
    margin:0 auto;
    padding:18px 12px 60px;
  }
  .slide-card{
    background:var(--cream);
    border-radius:14px;
    overflow:hidden;
    margin:22px 0;
    box-shadow:0 12px 30px rgba(0,0,0,.35);
    border:1px solid rgba(255,255,255,.06);
  }
  .slide-card img{
    display:block;
    width:100%;
    height:auto;
  }
  .slide-index{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
    margin:10px 0 4px;
  }
  .slide-index a{
    color:#dce7ee;
    text-decoration:none;
    font-size:12px;
    background:rgba(255,255,255,.08);
    padding:4px 10px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,.2);
  }
  .slide-index a:hover{
    background:var(--tan);
    color:#16384d;
  }
  footer{
    text-align:center;
    color:#9fb4c2;
    padding:26px 12px 40px;
    font-size:13px;
  }
  .backtotop{
    position:fixed;
    right:16px;
    bottom:16px;
    background:var(--tan);
    color:#16384d;
    width:44px;
    height:44px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    font-weight:700;
    box-shadow:0 6px 16px rgba(0,0,0,.35);
  }
  .case-detail{
    background:#fff;
    border-radius:14px;
    margin:-10px 0 22px;
    padding:20px 22px 24px;
    box-shadow:0 12px 30px rgba(0,0,0,.25);
    border:1px solid rgba(0,0,0,.05);
    font-family:'Segoe UI', Arial, sans-serif;
  }
  .case-detail h3{
    margin:0 0 10px;
    color:var(--navy);
    font-size:16px;
    font-family:inherit;
    font-weight:700;
    letter-spacing:.3px;
  }
  .case-detail .brief{
    font-size:13.5px;
    font-family:inherit;
    line-height:1.6;
    color:#3a4650;
    margin:0 0 6px;
    padding-left:12px;
    border-left:3px solid var(--tan);
  }
  .case-detail .brief:last-of-type{
    margin-bottom:14px;
  }
  .flow{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin:0 0 14px;
  }
  .flow span{
    background:var(--navy);
    color:#fff;
    font-size:11.5px;
    font-family:inherit;
    padding:5px 10px;
    border-radius:999px;
    white-space:nowrap;
  }
  .flow span:nth-child(even){
    background:var(--tan);
    color:#16384d;
  }
  .impact-box{
    background:linear-gradient(135deg,#fff3e6,#fde9d2);
    border:1px solid var(--tan);
    border-radius:10px;
    padding:14px 16px;
  }
  .impact-box .label{
    font-size:11px;
    font-family:inherit;
    font-weight:700;
    letter-spacing:.8px;
    color:#8a5a28;
    margin-bottom:8px;
  }
  .impact-grid{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
  }
  .impact-grid .metric{
    min-width:110px;
  }
  .impact-grid .metric b{
    display:block;
    font-size:19px;
    font-family:inherit;
    color:var(--navy);
    line-height:1.1;
  }
  .impact-grid .metric span{
    font-size:11.5px;
    font-family:inherit;
    color:#5b4632;
  }
  .cert-section{
    background:linear-gradient(180deg,var(--cream),#efe5d2);
    border-radius:14px;
    margin:22px 0;
    padding:26px 26px 28px;
    box-shadow:0 12px 30px rgba(0,0,0,.35);
    border:1px solid rgba(255,255,255,.06);
    font-family:'Segoe UI', Arial, sans-serif;
  }
  .cert-section .cert-eyebrow{
    display:inline-block;
    background:var(--navy);
    color:#fff;
    font-size:11.5px;
    font-weight:700;
    letter-spacing:.8px;
    padding:6px 16px;
    border-radius:999px;
    margin-bottom:6px;
  }
  .cert-section h3{
    margin:6px 0 4px;
    color:var(--navy);
    font-size:22px;
    letter-spacing:.3px;
  }
  .cert-section .cert-sub{
    font-size:12.5px;
    color:#6b5a42;
    margin:0 0 18px;
  }
  .cert-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:14px;
  }
  .cert-card{
    display:flex;
    gap:12px;
    align-items:flex-start;
    background:#fff;
    border:1px solid var(--tan);
    border-radius:12px;
    padding:12px 14px;
  }
  .cert-card .year-badge{
    flex:0 0 auto;
    background:var(--tan);
    color:var(--navy);
    font-size:11.5px;
    font-weight:800;
    padding:5px 10px;
    border-radius:8px;
    white-space:nowrap;
  }
  .cert-card .cert-text{
    font-size:12.5px;
    line-height:1.45;
    color:#2d2318;
  }
  @media (max-width:640px){
    .cert-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
  <a id="top"></a>
  <header class="hero">
    <h1>ĐỖ HẢI LY</h1>
    <p>Marketing Leader - Retail &amp; Education Marketing</p>
    <div class="contact-bar">
      <span>📞 0985775198</span>
      <span>✉️ dohailygtm126@gmail.com</span>
      <span>📍 Hà Nội</span>
    </div>
    <div class="slide-index" id="slideIndex"></div>
  </header>

  <main id="slides"></main>

  <footer>
    Portfolio 2026 · Đỗ Hải Ly · Cập nhật bởi trợ lý AI
  </footer>

  <a class="backtotop" href="#top" title="Lên đầu trang">↑</a>

  <script>
    const totalSlides = 14;
    const slidesEl = document.getElementById('slides');
    const indexEl = document.getElementById('slideIndex');

    // Case study chi tiết: Brief - Process (Research→Insight→Strategy→Plan→Execution→Optimization→Evaluation) - Outcome (impact box)
    // Chỉ dùng số liệu đã xác nhận; dự án chưa có số liệu cứng sẽ ghi outcome định tính + ghi chú.
    const caseDetails = {
      7: {
        title: 'Bối cảnh & Kết quả — Cuộc thi Đọc Sách Toàn Quốc 2026',
        context: 'Hadosa cần một dự án giáo dục quy mô toàn quốc để mở rộng độ phủ thương hiệu trong lĩnh vực giáo dục và lan tỏa văn hóa đọc.',
        goal: 'Tạo sân chơi đọc sách online dễ tham gia, thu hút đông đảo trường học & học sinh, gia tăng nhận diện thương hiệu trong cộng đồng giáo dục.',
        flow: ['Research: khảo sát hành vi đọc & nhu cầu thi đua của học sinh/nhà trường', 'Insight: trường học cần sân chơi thi đua, dễ tham gia qua nền tảng online', 'Strategy: cuộc thi đọc sách trực tuyến toàn quốc, lấy nhà trường làm kênh lan tỏa', 'Plan: timeline, nội dung câu hỏi, website, vận hành, truyền thông', 'Execution: phối hợp đa phòng ban triển khai & điều phối hoạt động tại trường', 'Optimization: tối ưu thông điệp truyền thông theo từng giai đoạn để tăng tham gia', 'Evaluation: đo bài thi, số trường tham gia, độ phủ báo chí'],
        metrics: [['219.000+','Bài thi tham gia'],['2.500+','Trường học tham gia'],['7+','Đầu báo/đài lớn đưa tin']]
      },
      10: {
        title: 'Bối cảnh & Kết quả — Khai trương Chuỗi Nhà sách Hadosa',
        context: 'Hadosa mở rộng chuỗi, cần chuẩn hóa truyền thông khai trương để thu hút khách ngày đầu và đồng bộ trải nghiệm thương hiệu tại từng điểm bán mới.',
        goal: 'Xây playbook khai trương có thể nhân rộng cho nhiều chi nhánh.',
        flow: ['Research: khảo sát dân cư/khách hàng khu vực từng điểm bán mới', 'Insight: mỗi điểm cần thông điệp local hóa nhưng vẫn giữ nhận diện chuỗi', 'Strategy: xây playbook khai trương chuẩn, nhân rộng được', 'Plan: timeline trước-trong-sau, content plan, ngân sách, Trade Marketing/VM', 'Execution: triển khai online-offline, phối hợp event/production/in ấn/PR-KOL', 'Optimization: điều chỉnh playbook sau mỗi lần khai trương dựa trên thực tế', 'Evaluation: đánh giá mức độ nhận diện & vận hành tại điểm bán'],
        metrics: [['5','Nhà sách đã khai trương'],['1','Playbook khai trương chuẩn hóa, nhân rộng toàn chuỗi']]
      },
      11: {
        title: 'Bối cảnh & Kết quả — Lễ ký kết Kỷ lục Guinness Việt Nam',
        context: 'Sự kiện xác lập kỷ lục Guinness Việt Nam gắn với dự án đọc sách, nhằm tăng uy tín thương hiệu Hadosa trong ngành giáo dục/xuất bản.',
        goal: 'Tạo dấu ấn truyền thông chính thống, có thể tái sử dụng tư liệu đa kênh.',
        flow: ['Research: bối cảnh & tiêu chí xác lập kỷ lục', 'Insight: cần sự kiện có tính chính thống, dễ được báo chí đưa tin', 'Strategy: gắn sự kiện với dự án đọc sách toàn quốc đang triển khai', 'Plan: kịch bản, khách mời, kế hoạch báo chí/truyền hình', 'Execution: điều phối trước-trong-sau sự kiện', 'Optimization: xử lý phát sinh hiện trường, đảm bảo thông điệp nhất quán', 'Evaluation: đo độ phủ truyền thông sau sự kiện'],
        metrics: [['1','Kỷ lục Guinness Việt Nam được xác lập'],['Đa kênh','Tư liệu truyền thông tái sử dụng']]
      },
      12: {
        title: 'Bối cảnh & Kết quả — Ký kết Hợp tác & Ra mắt Thương hiệu',
        context: 'Chương trình ký kết hợp tác/ra mắt thương hiệu cần thông điệp và hình ảnh nhất quán để tạo niềm tin với đối tác, khách hàng và báo chí.',
        goal: 'Đảm bảo truyền thông đồng bộ và khai thác nội dung sự kiện cho truyền thông dài hạn.',
        flow: ['Research: bối cảnh hợp tác, đối tượng truyền thông mục tiêu', 'Insight: đối tác/báo chí cần thông điệp rõ ràng, hình ảnh chuyên nghiệp', 'Strategy: định vị thông điệp hợp tác gắn với chiến lược thương hiệu', 'Plan: kịch bản nội dung, nhận diện hình ảnh, kế hoạch báo chí', 'Execution: phối hợp đối tác, báo chí, vận hành, thiết kế/production', 'Optimization: tận dụng tư liệu sự kiện để phát triển nội dung đa kênh', 'Evaluation: đánh giá mức độ nhất quán thông điệp & khả năng tái sử dụng nội dung'],
        metrics: [['Nhất quán','Thông điệp & hình ảnh thương hiệu'],['Đa kênh','Nội dung PR/social dài hạn']]
      },
      13: {
        title: 'Bối cảnh & Kết quả — AI Video & TikTok/Reels System',
        context: 'Đội ngũ cần tối ưu thời gian sản xuất content/video và vận hành CSKH fanpage bằng AI để tăng năng suất với nguồn lực hiện có.',
        goal: 'Xây quy trình AI-enabled giúp tiết kiệm thời gian/nhân sự và nâng năng lực sản xuất nội dung.',
        flow: ['Research: khảo sát công cụ AI phù hợp (ChatGPT, Gemini, Claude, Canva AI, CapCut AI, Grok, Higgfields)', 'Insight: phần lớn thời gian team tốn vào CSKH & dựng video thủ công', 'Strategy: xây AI Agent hỗ trợ CSKH + quy trình sản xuất video bằng AI', 'Plan: content pillar, format video, lịch đăng, hook mở đầu', 'Execution: triển khai AI Agent, đào tạo đội nhóm, sản xuất theo quy trình mới', 'Optimization: tái biên tập nội dung theo từng nền tảng TikTok/Facebook Reels', 'Evaluation: đo thời gian/nhân sự tiết kiệm được'],
        metrics: [['~80%','Nhân sự & thời gian CSKH fanpage tối ưu bằng AI'],['Nâng cao','Năng lực sản xuất video/content AI của đội nhóm']]
      }
    };

    // Danh sách đầy đủ chứng chỉ & giải thưởng (CV bản rút gọn đã cắt bớt, portfolio hiển thị đủ)
    const certificates = [
      ['05/2026', 'Hoàn thành khóa học Full-stack Marketing Warrior'],
      ['07/2025', 'Giải Nhất khóa học Hoạch định Chiến lược Marketing'],
      ['2023', 'Certificate kỹ năng nói nâng cao - MVP, MC Trần Ngọc'],
      ['2020', 'Certificate Digital Marketing - 88Lab'],
      ['2019', 'Certificate Know Thyself and Know Others with Carl Jung - MBTI'],
      ['2018', 'Leading and Managing | The Art of Public Speaking | Time Mastery | Live & Aspire'],
      ['2016', 'Giải Nhất Logo & Slogan']
    ];

    for (let i = 1; i <= totalSlides; i++) {
      const num = String(i).padStart(2, '0');
      const card = document.createElement('section');
      card.className = 'slide-card';
      card.id = 'slide-' + i;
      card.innerHTML = `<img src="slide_${num}.png" alt="Portfolio slide ${i}" loading="lazy" />`;
      slidesEl.appendChild(card);

      const a = document.createElement('a');
      a.href = '#slide-' + i;
      a.textContent = i;
      indexEl.appendChild(a);

      const d = caseDetails[i];
      if (d) {
        const det = document.createElement('section');
        det.className = 'case-detail';
        const flowHtml = d.flow.map(f => `<span>${f}</span>`).join('');
        const metricsHtml = d.metrics.map(m => `<div class="metric"><b>${m[0]}</b><span>${m[1]}</span></div>`).join('');
        det.innerHTML = `
          <h3>${d.title}</h3>
          <p class="brief"><b>Bối cảnh:</b> ${d.context}</p>
          <p class="brief"><b>Mục tiêu:</b> ${d.goal}</p>
          <div class="flow">${flowHtml}</div>
          <div class="impact-box">
            <div class="label">KẾT QUẢ NỔI BẬT / IMPACT</div>
            <div class="impact-grid">${metricsHtml}</div>
          </div>`;
        slidesEl.appendChild(det);
      }

      // Chèn trang Chứng chỉ & Giải thưởng ngay sau slide Success Stories (13), trước slide Contact (14)
      if (i === 13) {
        const certSection = document.createElement('section');
        certSection.className = 'cert-section';
        certSection.id = 'certificates';
        const certCardsHtml = certificates.map(c => `
          <div class="cert-card">
            <span class="year-badge">${c[0]}</span>
            <span class="cert-text">${c[1]}</span>
          </div>`).join('');
        certSection.innerHTML = `
          <span class="cert-eyebrow">HỌC VẤN &amp; PHÁT TRIỂN BẢN THÂN</span>
          <h3>Chứng chỉ &amp; Giải thưởng</h3>
          <p class="cert-sub">Đại học Kinh tế Quốc dân (IBD, 2016-2021) và các khóa học/giải thưởng đã hoàn thành trong quá trình làm nghề.</p>
          <div class="cert-grid">${certCardsHtml}</div>`;
        slidesEl.appendChild(certSection);

        const aCert = document.createElement('a');
        aCert.href = '#certificates';
        aCert.textContent = 'CC';
        indexEl.appendChild(aCert);
      }
    }
  </script>
</body>
</html>
